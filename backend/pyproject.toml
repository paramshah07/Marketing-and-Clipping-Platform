[project]
name = "clipper-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "httpx>=0.28",
    "procrastinate~=3.10",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = ["pytest>=8.4"]
worker = [
    "yt-dlp[default,curl-cffi,deno]>=2026.8.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

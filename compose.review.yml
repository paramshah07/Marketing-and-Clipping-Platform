# Review a branch on the Mac with a copy of production's data, without touching production (./review.sh).
# Its own project (clipper-review) and database volume; publishing off, no Zernio key (nor the SECRETS_KEY that
# opens the users' stored ones), no bot tokens or service secret, and the bots sit behind a profile nothing
# enables: this stack can't publish or poll Telegram, whatever .env says.
x-safe: &safe
  environment:
    PUBLISHING_ENABLED: "false"
    ZERNIO_API_KEY: ""
    SECRETS_KEY: ""
    BOT_SERVICE_SECRET: ""
    TELEGRAM_BOT_TOKEN: ""
    TELEGRAM_CHAT_ID: ""
    TELEGRAM_BOT_TOKEN_2: ""
    TELEGRAM_CHAT_ID_2: ""
    TELEGRAM_BOT_TOKEN_3: ""
    TELEGRAM_CHAT_ID_3: ""

services:
  postgres:
    ports: !reset [] # no host port: `docker compose run --rm worker pytest` keeps 5432 for the dev project
  migrate: *safe
  api: *safe
  worker: *safe
  publisher: *safe
  bot: { <<: *safe, profiles: [never] } # no service secret either: naming it on the command line enables its profile
